services:
  - type: web
    name: gcc-job-radar
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -e ."
    startCommand: "python tools/web_entrypoint.py"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PRIMARY_LLM_PROVIDER
        value: groq
      - key: SCAN_CONCURRENCY
        value: "15"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

