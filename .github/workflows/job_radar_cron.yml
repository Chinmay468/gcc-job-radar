name: Scheduled GCC Job Radar

on:
  schedule:
    # Run every 4 hours UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      company:
        description: 'Optional company name or token to filter scan'
        required: false
        default: ''
      digest:
        description: 'Batch alerts into a single consolidated daily digest message (--digest)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_USER_2: ${{ secrets.EMAIL_USER_2 || secrets.EMAIL_USER2 }}
      EMAIL_PASSWORD_2: ${{ secrets.EMAIL_PASSWORD_2 || secrets.EMAIL_PASSWORD2 }}
      EMAIL_USER_3: ${{ secrets.EMAIL_USER_3 || secrets.EMAIL_USER3 }}
      EMAIL_PASSWORD_3: ${{ secrets.EMAIL_PASSWORD_3 || secrets.EMAIL_PASSWORD3 }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore SQLite database cache
        uses: actions/cache@v4
        with:
          path: gcc_jobs.db
          key: job-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            job-db-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sync from Turso Cloud Database
        if: env.TURSO_DATABASE_URL != '' && env.TURSO_AUTH_TOKEN != ''
        run: |
          python -m gcc_job_radar.turso_sync --pull || echo "Turso pull warning"

      - name: Ingest Job Alert Emails
        if: env.EMAIL_USER != '' && env.EMAIL_PASSWORD != ''
        run: |
          python tools/ingest_email.py --days 1 --limit 50 --notify || echo "Email sync warning"

      - name: Run GCC Job Radar Scan
        run: |
          SCAN_ARGS="--new-only --json latest_openings.json"
          if [ "${{ github.event.inputs.digest }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            SCAN_ARGS="$SCAN_ARGS --digest"
          fi
          if [ -n "${{ github.event.inputs.company }}" ]; then
            gcc-job-radar --company "${{ github.event.inputs.company }}" $SCAN_ARGS
          else
            gcc-job-radar $SCAN_ARGS
          fi

      - name: Sync back to Turso Cloud Database
        if: env.TURSO_DATABASE_URL != '' && env.TURSO_AUTH_TOKEN != ''
        run: |
          python -m gcc_job_radar.turso_sync --push || echo "Turso push warning"


      - name: Upload latest openings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-openings
          path: latest_openings.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload tailored resumes artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailored-resumes
          path: tailored/
          if-no-files-found: ignore
          retention-days: 7
