name: Telegram Alert Relay

on:
  workflow_dispatch:
    inputs:
      message_b64:
        description: 'Base64-encoded UTF-8 HTML message text'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG_B64: ${{ inputs.message_b64 }}
        run: |
          MSG=$(echo "$MSG_B64" | base64 --decode)
          PAYLOAD=$(jq -n --arg chat "$CHAT_ID" --arg text "$MSG" '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Telegram Response: $RESP"
          if echo "$RESP" | jq -e '.ok == true' > /dev/null; then
            echo "Successfully delivered to Telegram."
          else
            echo "Failed to deliver to Telegram."
            exit 1
          fi
