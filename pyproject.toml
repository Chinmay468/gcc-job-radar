[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gcc-job-radar"
version = "0.1.0"
description = "CLI tool to track verified entry-level tech roles in India from non-Indian tech companies and foreign GCCs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27.0",
    "orjson>=3.10.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.45.0",
    "libsql-client>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gcc-job-radar = "gcc_job_radar.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["gcc_job_radar*"]

[tool.setuptools.package-data]
gcc_job_radar = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
